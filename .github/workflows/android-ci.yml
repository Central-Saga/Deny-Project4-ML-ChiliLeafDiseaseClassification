name: Android & ML CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-tests:
    name: Android unit tests (./gradlew testDebugUnitTest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Verify gradlew is executable (mode 100755)
        working-directory: .
        run: |
          git ls-files -s android-app/gradlew
          test "$(git ls-files -s android-app/gradlew | cut -c1-6)" = "100755"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            android-app/app/build/reports/tests/testDebugUnitTest/
            android-app/app/build/test-results/testDebugUnitTest/

  android-apk-build:
    name: Android APK & instrumented test build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and instrumented test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk

  ml-tests:
    name: ML reproducibility & TFLite tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal pinned deps
        run: pip install pandas==2.2.3 numpy==2.1.3 Pillow==11.3.0
      - name: Run ML unit tests
        run: python -m unittest discover -s ml/tests -v
